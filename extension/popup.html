<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Reference Grabber</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>★ Reference Grabber</h1>
    <span id="count"></span>
  </header>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search notes, titles, #tags…" autofocus />
    <button id="library" class="secondary" title="Open the full library page">Library</button>
    <button id="export" title="Export the shown items to CSV">CSV</button>
  </div>
  <ul id="list"></ul>
  <p id="empty" hidden></p>
  <footer>Alt+S on YouTube/SoundCloud to save · <a href="#" id="shortcuts">change shortcut</a></footer>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
